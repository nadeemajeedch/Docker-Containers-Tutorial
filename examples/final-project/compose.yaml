services:
  jupyter:
    build: .
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ./notebooks:/workspace/notebooks
      - ./data:/workspace/data
      - ./src:/workspace/src
      - ./tests:/workspace/tests
      - ./results:/workspace/results
    environment:
      STUDENT_NAME: ${STUDENT_NAME:-student}

  analyze:
    build: .
    volumes:
      - ./data:/workspace/data
      - ./src:/workspace/src
      - ./results:/workspace/results
    command: ["python", "src/analyze.py"]
    profiles:
      - script
