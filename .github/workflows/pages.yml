# Publishes the Docker Containers Tutorial as a GitHub Pages site.
#
# The site is built with MkDocs + Material from the repository's existing
# Markdown in place (injected via scripts/mkdocs_hooks.py — see mkdocs.yml):
# no tutorial content is moved, renamed or rewritten. Docker is never invoked:
# the Dockerfiles and docker-compose files under examples/ are educational
# content, not build steps.

name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serializes deployments per ref; the latest push wins, none cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Build documentation
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
